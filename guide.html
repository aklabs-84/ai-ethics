<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조심조심 AI 수업 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#16324F;--blue:#2F7BE0;--bluebg:#EAF3FF;--line:#DCEBFB;--green:#1A9E6B;--greenbg:#E6F8EF;--red:#D8504D;--redbg:#FDECEC;--hl:#FFE27A;--sub:#5A7089;--font:'Pretendard Variable',Pretendard,system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#fff;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px;color:var(--ink);font:600 clamp(20px,2.3vw,30px)/1.65 var(--font);overflow:hidden;word-break:keep-all}
body:before{content:"";position:fixed;left:3.2vw;top:0;bottom:0;width:3px;background:#F4A6A6;z-index:1}
.top{position:fixed;left:0;right:0;top:0;height:7px;background:var(--line);z-index:5}.top i{display:block;height:100%;background:var(--blue);width:0;transition:width .35s}
.stage{position:relative;z-index:2;height:100%;overflow-y:auto;padding:5vh 5vw 14vh 7vw}
.sl{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,24vw,330px);gap:2vw;align-items:start;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.side{position:sticky;top:2vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.bub{position:relative;background:var(--bluebg);border:3px solid var(--blue);border-radius:16px;padding:12px 18px;font-size:.82em;line-height:1.45;font-weight:800;text-align:center;width:100%}
.bub:after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:var(--bluebg);border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:translateX(-50%) rotate(45deg)}
.rb{width:78%;height:auto;animation:bob 3s ease-in-out infinite;margin-top:12px}
@keyframes bob{50%{transform:translateY(-8px)}}
.tag{display:inline-block;color:var(--blue);font-weight:900;font-size:.8em;border-bottom:4px solid var(--blue);margin-bottom:.2em}
h1,h2{font-weight:900;line-height:1.2;margin:.15em 0 .4em;letter-spacing:-.02em;color:var(--ink);font-size:clamp(34px,4.6vw,64px)}
h1{font-size:clamp(46px,6.8vw,96px)}
em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%)}
p{margin:.4em 0}b{font-weight:900;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.a{color:var(--green);font-weight:800}.x{color:var(--red);font-weight:800}.sub{color:var(--sub)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));margin-top:.6em}
.bx{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:14px 18px;transition:.15s;box-shadow:0 5px 0 var(--ink)}
.bx:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--blue);border-color:var(--blue)}
.bx h3{margin:0 0 .15em;font-size:1.05em}.bx .n{display:block;font-size:1.7em;font-weight:900;color:var(--blue);line-height:1.2}
.say{background:#FFF6C9;border-radius:6px;padding:12px 20px;margin:18px 0;box-shadow:0 3px 0 rgba(0,0,0,.08);transform:rotate(-.4deg)}
ul.l{margin:.3em 0;padding-left:1.2em}ul.l li{margin:.3em 0}
.trk{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tl{width:clamp(44px,5vw,66px);height:clamp(44px,5vw,66px);border-radius:10px;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.tl.r{border-color:var(--green);color:var(--green);background:var(--greenbg)}.tl.f{border-color:#C79A00;background:var(--hl)}.tl.s{color:var(--sub);border-style:dashed}
.card{background:#fff;border:3px solid var(--blue);border-radius:12px;padding:16px 22px;margin:12px 0}
.card .k{color:var(--blue);font-weight:900}.card .g{color:var(--green);font-weight:800}.card .b2{color:var(--red);font-weight:800}
.ch{display:inline-block;border:3px solid;border-radius:10px;padding:6px 18px;margin:6px 10px 6px 0;font-weight:800}
.ch.g{border-color:var(--green);color:#0e6b47;background:var(--greenbg)}.ch.b{border-color:var(--red);color:#a82f2c;background:var(--redbg)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;background:linear-gradient(rgba(255,255,255,0),#fff 40%);z-index:6}
.nav button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 26px;font:900 24px var(--font);cursor:pointer;box-shadow:0 4px 0 #1b56a5}
.nav button:hover{filter:brightness(1.08)}.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b56a5}
.nav button:disabled{background:#cfd8e3;color:#7b8794;box-shadow:none;cursor:default}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:46vw}.dots i{width:13px;height:13px;border-radius:50%;background:#C5D6EA;cursor:pointer}.dots i.on{background:var(--blue);transform:scale(1.3)}
@media (max-width:820px){.sl{grid-template-columns:1fr}.side{position:static;flex-direction:row-reverse;order:-1;align-items:flex-end;gap:14px}.rb{width:110px;margin:0}.bub{width:auto;flex:1}.bub:after{left:-13px;right:auto;bottom:auto;top:50%;transform:translateY(-50%) rotate(135deg)}.stage{padding:4vh 16px 16vh 22px}body:before{left:10px}.nav button{font-size:18px;padding:8px 14px;white-space:nowrap}.dots{max-width:40vw}}
</style>
</head>
<body>
<div class="top"><i id="bar"></i></div>
<div class="stage" id="st"></div>
<div class="nav"><button id="pv">◀ 이전</button><div class="dots" id="ds"></div><button id="nx">다음 ▶</button></div>
<script>
// 로봇 「아이」 — 코드로 그린 SVG. pose: wave | point | shield | cheer | think
function robot(pose){
  const sk='#2F7BE0',sw=3.2,arm=d=>`<path d="${d}" fill="none" stroke="${sk}" stroke-width="${sw}" stroke-linecap="round"/>`;
  const shield=`<path d="M150 140 h52 v34 q0 26 -26 36 q-26 -10 -26 -36z" fill="#FFE27A" stroke="${sk}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M164 164 l9 9 l17 -19" fill="none" stroke="${sk}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const down=arm('M40 150 Q20 170 22 190');
  const arms={wave:arm('M40 150 Q16 140 14 104')+arm('M160 150 Q176 160 178 182'),point:down+arm('M160 148 Q196 130 226 128'),shield:down+shield,cheer:arm('M40 150 Q8 130 16 84')+arm('M160 150 Q192 130 184 84'),think:down+arm('M160 152 Q184 140 140 124')}[pose];
  return `<svg class="rb" viewBox="0 0 240 250" aria-hidden="true"><ellipse cx="100" cy="242" rx="52" ry="7" fill="rgba(0,0,0,.1)"/>${arms}
  <rect x="58" y="140" width="84" height="84" rx="14" fill="#fff" stroke="${sk}" stroke-width="${sw}"/><circle cx="100" cy="182" r="11" fill="none" stroke="${sk}" stroke-width="2.4"/>
  <rect x="64" y="216" width="26" height="22" rx="9" fill="#fff" stroke="${sk}" stroke-width="${sw}"/><rect x="110" y="216" width="26" height="22" rx="9" fill="#fff" stroke="${sk}" stroke-width="${sw}"/>
  <line x1="100" y1="22" x2="100" y2="42" stroke="${sk}" stroke-width="${sw}" stroke-linecap="round"/><circle cx="100" cy="16" r="9" fill="#FFE27A" stroke="${sk}" stroke-width="${sw}"/>
  <rect x="30" y="40" width="140" height="106" rx="22" fill="#fff" stroke="${sk}" stroke-width="${sw}"/><rect x="44" y="56" width="112" height="72" rx="14" fill="#EAF3FF" stroke="${sk}" stroke-width="1.7"/>
  <circle cx="78" cy="86" r="8" fill="${sk}"/><circle cx="122" cy="86" r="8" fill="${sk}"/><circle cx="81" cy="83" r="3" fill="#fff"/><circle cx="125" cy="83" r="3" fill="#fff"/>
  <path d="${pose==='think'?'M88 110 L112 110':'M84 106 Q100 120 116 106'}" fill="none" stroke="${sk}" stroke-width="${sw}" stroke-linecap="round"/>
  <rect x="20" y="76" width="10" height="28" rx="5" fill="#fff" stroke="${sk}" stroke-width="2.2"/><rect x="170" y="76" width="10" height="28" rx="5" fill="#fff" stroke="${sk}" stroke-width="2.2"/></svg>`;
}
// 슬라이드: [로봇 자세, 말풍선, 본문]
const S=[
['wave','안녕! 나는 <b>아이</b>야.<br>같이 배워 보자!',`<span class="tag">오늘 수업</span><h1><em>조심조심</em> AI</h1>
<p>AI와 함께 사는 시대, 우리는 <b>어떻게 행동하면 좋을까요?</b></p>
<p class="sub">이야기를 체험하고, 문제를 직접 만들고, 친구들과 보드게임을 하면서 알아봐요.</p>
<div class="say">☝ 이 화면은 선생님과 함께 읽어요. <b>키보드 ◀ ▶ 화살표</b>로 넘겨요.</div>`],

['point','오늘 할 일은<br>딱 <b>4가지</b>야!',`<span class="tag">오늘의 큰 그림</span><h2>오늘 할 일 <em>4가지</em></h2>
<div class="grid">
<div class="bx"><span class="n">1</span><h3>이야기 체험</h3>주인공이 되어 선택해요. 결말마다 카드를 한 장씩 모아요.</div>
<div class="bx"><span class="n">2</span><h3>사건카드 만들기</h3>우리 모둠이 AI 문제 <b>2장</b>을 만들어요.</div>
<div class="bx"><span class="n">3</span><h3>제출하기</h3>만든 것과 느낀 점을 클래스로그 AI에 내요.</div>
<div class="bx"><span class="n">4</span><h3>보드게임 대결</h3>모둠끼리 서로의 문제로 겨뤄요!</div></div>
<div class="say">순서는 <b>체험 → 만들기 → 제출 → 대결</b>이에요. 대결에서 쓰려면 앞의 세 가지를 꼭 해야 해요.</div>`],

['think','어떤 선택을 할까?<br>잘 생각해 봐!',`<span class="tag">1 · 이야기 체험</span><h2>내가 <em>주인공</em>이 되어요</h2>
<p>이야기 중간마다 <b>어떻게 할까?</b> 하고 물어요. 하나를 골라요. 고른 대로 이야기가 달라져요.</p>
<p>이야기가 끝나면 <b>결말 카드</b>가 한 장 생겨요. 다른 선택을 하면 다른 결말, 다른 카드를 만나요!</p>
<div class="grid">
<div class="bx"><h3>🛡 방패 카드</h3>잘 지켜서 끝난 결말. 대결에서 <span class="a">나를 지켜 줘요.</span></div>
<div class="bx"><h3>⚠ 함정 카드</h3>아쉬웠던 결말. 왜 아쉬웠는지 꼭 읽어 봐요.</div>
<div class="bx"><h3>🔀 갈림길 카드</h3>좋기도 나쁘기도 한 결말이에요.</div>
<div class="bx"><h3>⭐ 특별 카드</h3>결말을 모두 모으면 받아요.</div></div>`],

['point','예시를 보고<br><b>우리 이야기</b>로<br>바꿔 봐!',`<span class="tag">2 · 사건카드 만들기</span><h2>우리 모둠이 <em>문제</em>를 내요</h2>
<p>한 모둠이 <b>사건 2장</b>을 만들어요. 다른 모둠이 이 문제를 풀어요. 내 문제는 우리 모둠에는 안 나와요.</p>
<div class="card"><span class="k">예) 개념 「출처 확인」</span><br>
<b>무슨 일이 벌어졌나요?</b> 역사 숙제를 하는데 AI가 “거북선이 100척 싸웠다”고 했다. 책에는 다른 숫자가 있다.<br>
<b>질문:</b> 이 숫자를 어떻게 할까?<br>
<span class="g">✓ 좋은 선택:</span> 책과 인터넷에서 다시 찾아보고 맞는 숫자를 쓴다<br>
<span class="b2">✗ 아쉬운 선택:</span> AI가 말했으니 그대로 쓴다</div>
<div class="say">화면에서 개념 카드를 누르면 <b>예시</b>가 나와요. 그대로 쓰지 말고 <b>우리 모둠의 이야기</b>로 바꿔요!</div>`],

['point','긴 글자도<br>꼭 <b>같이</b> 내야 해!',`<span class="tag">3 · 제출하기</span><h2>클래스로그 AI에 <em>내요</em></h2>
<ul class="l">
<li><b>①</b> 메뉴에서 <b>「오늘 수업 제출하기」</b>를 눌러요.</li>
<li><b>②</b> 이야기마다 느낀 점과 우리 모둠의 약속 한 줄을 써요.</li>
<li><b>③</b> <b>「제출 내용 만들기」</b> → <b>모두 복사</b>해요.</li>
<li><b>④</b> 클래스로그 AI 학생 페이지의 <b>「결과 제출하기」</b>에 붙여넣어요.</li><li><b>⑤</b> <b>조원 모두</b>가 각자 제출해요. 그래야 모두가 모은 카드가 <b>우리 모둠 카드</b>로 합쳐져요!</li></ul>
<div class="say">⚠ 맨 아래 <b>긴 글자(대결용 코드)</b>도 지우지 말고 <b>같이</b> 내야 해요. 그 글자가 있어야 우리 모둠이 보드게임에 나올 수 있어요!</div>`],

['cheer','주사위를 굴려<br>12칸을 달려 봐!',`<span class="tag">4 · 보드게임 대결</span><h2>길은 <em>12칸</em>이에요</h2>
<div class="trk"><div class="tl s">출발</div><div class="tl">1</div><div class="tl">2</div><div class="tl">3</div><div class="tl">4</div><div class="tl r">쉼</div><div class="tl">6</div><div class="tl">7</div><div class="tl">8</div><div class="tl">9</div><div class="tl r">쉼</div><div class="tl">11</div><div class="tl f">🏆</div></div>
<ul class="l">
<li>모둠 대표(<b>조장</b>)가 나와서 <b>주사위</b>를 굴려요. 한 번에 <b>1~3칸</b> 가요.</li>
<li>멈춘 칸에서 <b>AI 사건</b>이 나와요. 쉼 칸(☕)은 문제 없이 쉬어 가요.</li>
<li>🏆 에 <b>먼저 도착</b>하면 이겨요!</li></ul>`],

['think','모둠이 함께<br>의논해 봐!',`<span class="tag">4 · 보드게임 대결</span><h2>사건이 <em>나오면?</em></h2>
<div class="card"><b>모둠이 함께 의논</b>해서 답을 정해요. 조장이 말하면 선생님이 눌러요.<br><span class="sub">⏱ 한 번에 40초! 시간이 끝나면 아쉬운 선택이에요.</span></div>
<span class="ch g">✓ 좋은 선택 → 2칸 앞으로 ✨</span><span class="ch b">✗ 아쉬운 선택 → 2칸 뒤로 💥</span>
<div class="say">틀려도 괜찮아요. 화면이 <b>왜 좋은 선택인지</b> 알려 줘요. 그게 오늘의 배움이에요.</div>`],

['shield','이름이 <b>같을 때만</b><br>막을 수 있어!',`<span class="tag">4 · 보드게임 대결</span><h2>🛡 <em>방패</em>로 막아요</h2>
<p>아쉬운 선택을 했을 때, 사건의 <b>개념</b>과 <b>같은 이름의 방패 카드</b>가 내 손에 있으면 막을 수 있어요!</p>
<div class="card">예) 사건 개념이 <span class="k">「출처 확인」</span> → 내 방패 카드 <span class="k">「출처 확인」</span>이 <b>반짝!</b> → 눌러서 <span class="a">뒤로 가기 취소</span></div>
<ul class="l"><li>이름이 <b>같을 때만</b> 막아요.</li><li>모둠마다 방패는 <b>최대 3번</b>만 써요. 아껴 써요!</li><li>이야기 체험에서 카드를 많이 모을수록 유리해요.</li></ul>`],

['point','조장도, 친구들도,<br>선생님도 모두 중요해!',`<span class="tag">모둠 역할</span><h2>우리 모둠은 <em>이렇게</em></h2>
<div class="grid">
<div class="bx"><h3>🎲 조장</h3>앞에 나와서 주사위를 굴리고 모둠의 답을 말해요.</div>
<div class="bx"><h3>💬 모둠 친구들</h3>자리에서 <b>같이 의논</b>해요. 이유를 말해 주세요.</div>
<div class="bx"><h3>🖱 선생님</h3>모둠이 말한 답을 눌러요.</div></div>
<div class="say">정답을 빨리 맞히는 것보다 <b>“왜 그게 좋은 선택일까?”</b>를 이야기하는 게 더 중요해요. 다른 모둠 차례에도 <b>같이 생각해 봐요.</b></div>`],

['cheer','진 모둠도 괜찮아!<br>새로 배웠잖아!',`<span class="tag">끝나고 나면</span><h2>이기는 법 · <em>결과표</em></h2>
<ul class="l"><li>🏆 먼저 도착한 모둠이 우승이에요.</li><li>시간이 끝나면 <b>가장 멀리 간 모둠</b>이 우승이에요.</li><li>결과표에 <b>「다시 생각해 볼 말」</b>이 나와요. 우리가 아쉬웠던 개념이에요.</li></ul>
<div class="say">진 모둠도 괜찮아요. 아쉬웠던 말이 곧 <b>내가 새로 배운 말</b>이에요!</div>`],

['shield','AI랑 잘 지내는<br><b>4가지 약속</b>이야!',`<span class="tag">오늘 배우는 약속</span><h2>AI와 잘 지내는 <em>4가지</em></h2>
<div class="grid">
<div class="bx"><span class="n">①</span><h3>확인하기</h3>AI는 자신 있게 틀릴 수 있어요. 쓰기 전에 다른 곳과 맞춰 봐요.</div>
<div class="bx"><span class="n">②</span><h3>정보 지키기</h3>이름·학교·얼굴은 한번 나가면 되돌리기 어려워요.</div>
<div class="bx"><span class="n">③</span><h3>사람 해치지 않기</h3>웃기려 했어도 당한 사람이 아프면 해침이에요. 허락부터!</div>
<div class="bx"><span class="n">④</span><h3>밝히기 · 내 책임</h3>AI를 써도 괜찮아요. 어떻게 썼는지 말하고, 내가 낸 건 내 책임이에요.</div></div>`],

['cheer','준비됐지?<br>출발!',`<span class="tag">준비됐나요?</span><h2>시작해 <em>봐요!</em></h2>
<ul class="l"><li>🎒 노트북에서 <b>이야기 체험</b>부터 시작해요.</li><li>🃏 모둠 친구들과 <b>사건카드 2장</b>을 만들어요.</li><li>📤 <b>제출하기</b>를 눌러 클래스로그 AI에 내요.</li><li>🎲 선생님 화면에서 <b>모둠 대결!</b></li></ul>
<div class="say">모르는 게 있으면 손을 들고 물어봐요. 😊</div>`]
];
let i=0;const st=document.getElementById('st'),ds=document.getElementById('ds');
ds.innerHTML=S.map((_,k)=>`<i data-k="${k}"></i>`).join('');
function show(n){i=Math.max(0,Math.min(S.length-1,n));const s=S[i];
  st.innerHTML=`<div class="sl"><div class="main">${s[2]}</div><div class="side"><div class="bub">${s[1]}</div>${robot(s[0])}</div></div>`;st.scrollTop=0;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  [...ds.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  document.getElementById('pv').disabled=i===0;document.getElementById('nx').disabled=i===S.length-1;
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
document.getElementById('pv').onclick=()=>show(i-1);document.getElementById('nx').onclick=()=>show(i+1);
ds.onclick=e=>{const k=e.target.dataset.k;if(k!=null)show(+k)};
document.onkeydown=e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1)};
show((parseInt(location.hash.slice(1),10)||1)-1);
</script>
